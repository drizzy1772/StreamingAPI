<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    <body class="bg-black text-white font-[Geist] min-h-screen flex items-center justify-center">
        
        <div id="auth-section" class="bg-black border border-white/10 rounded-2xl p-8 w-full max-w-md flex flex-col gap-4 shadow-2xl">
            

            
            <h1 class="text-3xl font-semibold tracking-tight text-center">StreamingAPI</h1>
            
            <input id="username" placeholder="Username"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
            <input id="email" placeholder="Email"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
            <input id="password" placeholder="Password"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>

            <button onclick="login()" class="bg-white text-black rounded-lg px-4 py-2.5 w-full font-medium hover:bg-gray-200 transition">Login</button>
            <button onclick="register()" class="bg-transparent border border-white/10 text-white rounded-lg px-4 py-2.5 w-full font-medium hover:bg-white/5 hover:border-white/20 transition">Register</button>

            <div class="flex gap-3 mt-2">
                <a 
                href="https://github.com/drizzy1772"
                target="_blank"
                rel="noopener noreferrer"
                class="flex-1 flex items-center justify-center gap-2 border border-white/10 text-white rounded-lg px-4 py-2.5 hover:bg-white/5 hover:border-white/20 transition"
            >

            </a>
            </div>
            
            <a
                href="https://linktr.ee/bodyafrozen890?utm_source=linktree_profile_share&ltsid=1863a48a-7172-4053-8a5b-955e86dfb338"
                target="_blank"
                rel="noopener noreferrer"
                class="flex-1 flex items-center justify-center gap-2 border border-white/10 text-white rounded-lg px-4 py-2.5 hover:bg-white/5 hover:border-white/20 transition"
            >
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" image-rendering="optimizeQuality" fill-rule="evenodd" clip-rule="evenodd" viewBox="0 0 417 512.238"><path fill="#fff" fill-rule="nonzero" d="M171.274 344.942h74.09v167.296h-74.09V344.942zM0 173.468h126.068l-89.622-85.44 49.591-50.985 85.439 87.829V0h74.086v124.872L331 37.243l49.552 50.785-89.58 85.241L417 173.268v70.502H290.252l90.183 87.63L331 381.192 208.519 258.11 86.037 381.192l-49.591-49.591 90.218-87.631H0v-70.502z"/>
            </svg>
            </a>

            <button id="copy-btn" class="hidden bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg px-4 py-2 w-full" onclick="copyToken()">Copy token</button>

            <div id="token-result" class="min-h-[48px]">
            </div>

        </div>

        <div id="interests-section" class="hidden w-full min-h-screen flex flex-col items-center justify-center px-6 py-10">
            
            <div class="w-full max-w-2xl">

                <h2 class="text-3xl font-semibold tracking-tight text-center">
                    Choose your interests
                </h2>


                <p class="text-gray-500 text-center mt-2">
                    Choose 3 topics you're interested in
                </p>


                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-8">
                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Python
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        FastAPI
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        PostgreSQL
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Docker
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Redis
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        JavaScript
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        TypeScript
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        React
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Django
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Cybersecurity
                    </button>

                </div>

                <button onclick=
                "goBackToAuth()"
                class="bg-white text-black rounded-lg px-4 py-2 font-medium hover:bg-gray-200 transition mt-4">
                Back
                </button>
                <button onclick=
                "saveInterests()"
                 class="mt-8 bg-white text-black font-medium py-2.5 px-8 rounded-lg hover:bg-gray-200 transition w-full">
                    Continue
                </button>
        </div>
    </div>
        
            <div id="feed-section" class="hidden w-full min-h-screen flex flex-col items-center px-6 py-10">

        <div class="w-full max-w-5xl flex items-center justify-between mb-8">

            <div>
                <h2 class="text-3xl font-semibold tracking-tight">
                    Welcome to your Feed!
                </h2>

                <p id="nav_username" class="text-gray-500 mt-1">
                    Loading user...
                </p>
            </div>

        <div class="flex gap-2">
            <button
                onclick="showSaved()"
                class="border border-white/10 text-sm text-white px-4 py-2 rounded-lg hover:bg-white/5 hover:border-white/20 transition-all duration-200">
                Saved
            </button>

            <button
                onclick="logout()"
                class="border border-white/10 text-sm text-white px-4 py-2 rounded-lg hover:bg-white/5 hover:border-white/20 transition-all duration-200">
                Logout
            </button>

            <button
                onclick="showProfile()"
                class="border border-white/10 text-sm text-white px-4 py-2 rounded-lg hover:bg-white/5 hover:border-white/20 transition-all duration-200">
                Profile
            </button>
            
        </div>
    </div>
            <div class="w-full max-w-5xl bg-white/[0.02] border border-white/10 p-6 rounded-2xl mb-8 flex flex-col gap-4 mt-6">

                <h3 class="text-lg font-medium tracking-tight text-white">Search Articles</h3>

                <input id="search-query" placeholder="Keywords or Tags" class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
                <button onclick="searchArticles()" class="bg-white text-black font-medium py-2 px-5 rounded-lg hover:bg-gray-200 transition-all duration-200 w-full md:w-auto self-end">
                    Search
                </button>
                
                <div id="search-history" class="flex flex-wrap gap-2">
                </div>

            </div>
            <div id="feed-cards" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        </div>
        
        <div id="saved-section" class="hidden w-full min-h-screen flex flex-col items-center px-6 py-10">
            <div class="w-full max-w-5xl flex items-center justify-between mb-8">
            <h2 class="text-3xl font-semibold tracking-tight">
                Saved Articles
            </h2>   
            
            <button onclick="showFeed()"
            class="bg-white text-black rounded-lg px-4 py-2.5 font-medium hover:bg-gray-200 transition">
                Back to feed
            </button>
        </div>
        <div id="saved-cards" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
        
        <div id="profile-section" class="hidden w-full min-h-screen flex flex-col items-center px-6 py-10">
            <div class="w-full max-w-2xl flex items-center justify-between mb-8">
                <h2 class="text-3xl font-semibold tracking-tight">
                    Your profile
                </h2>
                <button onclick="showFeed()"
                class="bg-white text-black rounded-lg px-4 py-2.5 font-medium hover:bg-gray-200 transition">
                    Back to feed
                </button>
            </div>
    
    <div class="w-full max-w-2xl bg-white/[0.02] border border-white/10 p-6 rounded-2xl">

        <div class="flex items-center gap-6">

            <div class="w-20 h-20 rounded-xl overflow-hidden border border-white/10 shrink-0">
                <img
                    src="avatar.jpg"
                    alt="Avatar"
                    class="w-full h-full object-cover"
                    id="profile-avatar"
                >
            </div>

            <input type="file" id="avatar-input" onchange="changeAvatar(event)" style="display: none;" accept="image/*"/>

            <label for="avatar-input" class="avatar-label">Change avatar</label>
            

            
            <div class="flex flex-col gap-2">

                <div>
                    <p class="text-gray-500 text-sm">Username</p>
                    <p id="profile-username" class="text-lg text-white">-</p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Email</p>
                    <p id="profile-email" class="text-lg text-white">-</p>
                </div>

                <div>
                    <p class="text-gray-500 text-sm">Joined</p>
                    <p id="profile-joined" class="text-lg text-white">-</p>
                </div>
            </div>
        </div>


        <div class="border-t border-white/10 my-6"></div>

        <h3 class="text-xl font-medium tracking-tight mb-4">
            Saved Articles
        </h3>

        <div
            id="profile-saved-cards"
            class="grid grid-cols-1 md:grid-cols-2 gap-4"
        >
        </div>
    </div>

    </div>

    <script src="app.js"></script>
    
    </body>
    </html>
