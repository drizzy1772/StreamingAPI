<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

    <body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">
        
        <div id="auth-section" class="bg-gray-800 rounded-xl p-8 w-full max-w-md flex flex-col gap-4">
            <h1 class="text-2xl font-bold text-center">StreamingAPI</h1>

            <input id="username" placeholder="Username"
            class="bg-gray-700 rounded-lg px-4 py-2 w-full outline-none"/>
            <input id="email" placeholder="Email"
            class="bg-gray-700 rounded-lg px-4 py-2 w-full outline-none"/>
            <input id="password" placeholder="Password"
            class="bg-gray-700 rounded-lg px-4 py-2 w-full outline-none"/>

            <button onclick="login()" class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2 w-full">Login</button>
            <button onclick="register()" class="bg-green-500 hover:bg-green-600 text-white rounded-lg px-4 py-2 w-full">Register</button>
            <button id="copy-btn" class="hidden bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg px-4 py-2 w-full" onclick="copyToken()">Copy token</button>

            <div id="token-result" class="min-h-[48px]"></div>
        </div>
        
        <div id="feed-section" class="hidden w-full min-h-screen flex flex-col items-center p-8">
            <h2 class="text-2xl font-bold mb-4">Welcome to your Feed!</h2>
            <div class="flex items-center gap-4">
                <span id="nav_username" class="text-gray-300 font-medium">Loading user...</span>
                <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-1.5 rounded-md text-sm font-bold transition">Logout</button>
            </div>

            <div id="feed-cards" class="w-full flex flex-col gap-4"></div>

        </div>
        
        <script src="app.js"></script>
        
    </body>
    </html>
