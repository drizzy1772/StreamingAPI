<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
    <body class="bg-black text-white font-[Geist] min-h-screen flex items-center justify-center">
        
        <div id="auth-section" class="bg-black border border-white/10 rounded-2xl p-8 w-full max-w-md flex flex-col gap-4 shadow-2xl">
            

            
            <h1 class="text-3xl font-semibold tracking-tight text-center">StreamingAPI</h1>
            
            <input id="username" placeholder="Username"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
            <input id="email" placeholder="Email"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
            <input id="password" placeholder="Password"
            class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>

            <button onclick="login()" class="bg-white text-black rounded-lg px-4 py-2.5 w-full font-medium hover:bg-gray-200 transition">Login</button>
            <button onclick="register()" class="bg-transparent border border-white/10 text-white rounded-lg px-4 py-2.5 w-full font-medium hover:bg-white/5 hover:border-white/20 transition">Register</button>
            <button id="copy-btn" class="hidden bg-yellow-600 hover:bg-yellow-700 text-white rounded-lg px-4 py-2 w-full" onclick="copyToken()">Copy token</button>

            <div id="token-result" class="min-h-[48px]">
            </div>

        </div>

        <div id="interests-section" class="hidden w-full min-h-screen flex flex-col items-center justify-center px-6 py-10">
            
            <div class="w-full max-w-2xl">

                <h2 class="text-3xl font-semibold tracking-tight text-center">
                    Choose your interests
                </h2>

                <p class="text-gray-500 text-center mt-2">
                    Choose 3 topics you're interested in
                </p>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-8">
                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Python
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        FastAPI
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        PostgreSQL
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Docker
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Redis
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        JavaScript
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        TypeScript
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        React
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Django
                    </button>

                    <button class="interest-btn border border-white/10 rounded-xl px-4 py-3 text-sm text-gray-300 hover:bg-white/5 hover:border-white/20 transition">
                        Cybersecurity
                    </button>

                </div>
                <button onclick=
                "saveInterests()"
                 class="mt-8 bg-white text-black font-medium py-2.5 px-8 rounded-lg hover:bg-gray-200 transition w-full">
                    Continue
                </button>
        </div>
    </div>
        
            <div id="feed-section" class="hidden w-full min-h-screen flex flex-col items-center px-6 py-10">

        <div class="w-full max-w-5xl flex items-center justify-between mb-8">

            <div>
                <h2 class="text-3xl font-semibold tracking-tight">
                    Welcome to your Feed!
                </h2>

                <p id="nav_username" class="text-gray-500 mt-1">
                    Loading user...
                </p>
            </div>

            <button
                onclick="logout()"
                class="border border-white/10 text-sm text-white px-4 py-2 rounded-lg hover:bg-white/5 hover:border-white/20 transition-all duration-200">
                Logout
            </button>
            
        </div>
            
            <div class="w-full max-w-5xl bg-white/[0.02] border border-white/10 p-6 rounded-2xl mb-8 flex flex-col gap-4 mt-6">
                <h3 class="text-lg font-medium tracking-tight text-white">Create new post</h3>
                <input id="new-title" placeholder="Post title" class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
                <input id="new-tags" placeholder="Tags" class="bg-black border border-white/10 rounded-lg px-4 py-2.5 w-full outline-none text-white placeholder:text-gray-500 focus:border-white/30 transition"/>
                <button onclick="createContent()" class="bg-white text-black font-medium py-2 px-5 rounded-lg hover:bg-gray-200 transition-all duration-200 w-full md:w-auto self-end">
                    Create Post
                </button>
            </div>
            <div id="feed-cards" class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        </div>
        
        <script src="app.js"></script>
        
    </body>
    </html>
